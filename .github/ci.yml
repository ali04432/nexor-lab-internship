name: Week 3 CI/CD & Monitoring Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest flask gunicorn

    # Task 1 Validation
    - name: Validate Task 1 (Auto-Deploy CD Code)
      run: |
        flake8 week3_task1 --count --select=E9,F63,F7,F82 --show-source --statistics

    # Task 2 Validation
    - name: Validate Task 2 (Monitoring & Logging Code)
      run: |
        flake8 week3_task2 --count --select=E9,F63,F7,F82 --show-source --statistics