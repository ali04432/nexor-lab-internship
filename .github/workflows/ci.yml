name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  ci-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest flask

    # Step 1: LINT
    - name: 1. Run Linting
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # Step 2: TEST
    - name: 2. Run Tests
      run: |
        pytest || python -m unittest discover

    # Step 3: BUILD
    - name: 3. Build Docker Image
      run: |
        docker build -t nexor-app:latest .